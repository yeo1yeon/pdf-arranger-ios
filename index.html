<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>PDF Arranger</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#152030;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) 18px 60px}h1{font-size:27px;margin:0 0 8px}p{line-height:1.55;color:#5b6572}section{background:white;border:1px solid #e5e9ef;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 3px 14px #14213308}label{font-size:14px;font-weight:650;display:block;margin:14px 0 7px}input[type=file]{width:100%;padding:13px;background:#f5f6fa;border-radius:12px}select,input[type=number]{background:#f8f9fb;border:1px solid #dce2e9;border-radius:11px;padding:12px;font:inherit;width:100%}input[type=range]{width:100%;accent-color:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:12px;color:#687484}.value{float:right;font-weight:500;color:#536479}.primary{width:100%;border:0;background:#2563eb;color:white;padding:16px;border-radius:13px;font:700 17px inherit;cursor:pointer}.primary:disabled{opacity:.55;cursor:default}#status{white-space:pre-line;font-size:14px;margin-top:12px}progress{width:100%;height:12px;display:none}#download{display:none;text-align:center;background:#e9f7ed;color:#176239;border-radius:12px;padding:15px;margin-top:14px;font-weight:700;text-decoration:none}.sample{display:flex;align-items:stretch;gap:4px;width:100%;aspect-ratio:1.5;background:#dce3ec;padding:9px;border-radius:7px}.sheet{background:white;display:grid;flex:1;gap:3px;padding:4px}.page{background:repeating-linear-gradient(to bottom,#aab6c6 0px,#aab6c6 2px,transparent 2px,transparent 7px);border:2px solid #d8e0e9;margin:2px}.note{padding:12px;background:#fff8e8;border-radius:12px;color:#725019;font-size:13px;line-height:1.5}.switch{display:flex;align-items:center;gap:10px}.switch input{width:20px;height:20px}footer{font-size:12px;color:#707987;line-height:1.6}
input[type=text]{width:100%;padding:12px;border:1px solid #aab4c2;border-radius:10px;font:inherit;background:transparent;color:inherit}button{font:inherit;cursor:pointer}#thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin:12px 0}.thumb{border:2px solid #aab4c2;border-radius:8px;background:transparent;color:inherit;padding:5px;min-height:100px}.thumb.selected{border-color:#2563eb;background:#2563eb22}.thumb canvas{width:100%;height:auto;display:block}#download,#share{width:100%;border:0;padding:14px;border-radius:10px;margin-top:10px} [hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{background:#101318;color:#e5e9ef}section{background:#1c222b;border-color:#333b48}p,.hint,.value,footer{color:#aeb9c9}select,input[type=file]{background:#252d38;color:#eee;border-color:#485363}.note{background:#352b19;color:#f3d89d}} #dropZone{border:1px dashed #aab4c2;border-radius:12px;padding:12px;margin-top:8px}#dropZone.dragging{border-color:#2563eb;background:#2563eb18}#pastePDF{margin-top:8px;padding:10px 14px;border:1px solid #aab4c2;border-radius:9px;background:transparent;color:inherit}#pasteTarget{margin-top:8px;padding:10px;border:1px solid #aab4c2;border-radius:8px;color:inherit;font-size:14px}#pasteTarget:empty:before{content:'여기를 길게 눌러 붙여넣기';color:#788395;pointer-events:none}</style></head><body><main><h1>PDF Arranger</h1><section><label for="file">① PDF 선택</label><div id="dropZone"><input id="file" type="file" accept="application/pdf,.pdf"><button id="pastePDF" type="button">붙여넣기</button><div id="pasteTarget" contenteditable="true" role="textbox" aria-label="PDF 붙여넣기" inputmode="none" hidden></div><p class="hint" style="margin-bottom:0">PDF를 여기에 끌어다 놓을 수도 있습니다.</p></div><p id="info" class="hint">파일을 선택해 주세요.</p><label>② 페이지 선택</label><select id="selection"><option value="all">전체 페이지</option><option value="range">페이지 범위 및 순서 지정</option><option value="visual">썸네일로 선택</option></select><div id="rangeBox" hidden><label for="range">페이지 번호</label><input id="range" type="text" placeholder="1-20, 35, 50-60"><p class="hint">입력한 순서대로 배치합니다. 예: 5, 3, 1-2</p></div><div id="visualBox" hidden><button id="thumbLoad" type="button">썸네일 불러오기</button><button id="clearPages" type="button">선택 해제</button><p id="thumbStatus" class="hint"></p><div id="thumbs"></div><button id="more" type="button" hidden>다음 24페이지</button></div><p id="countInfo" class="hint"></p><label for="mode">③ 페이지 배치</label><select id="mode"><option value="2">2페이지 — 좌우 배치</option><option value="4">4페이지 — 2×2 배치</option></select><div class="grid"><div><label for="orientation">출력 방향 (A4/A3)</label><select id="orientation"><option value="landscape">가로</option><option value="portrait">세로</option></select></div><div><label for="pageSize">출력 용지</label><select id="pageSize"><option value="auto">원본 비율 · 여백 최소화</option><option value="a4">A4</option><option value="a3">A3</option></select></div></div><label for="crop">④ 원본 페이지 가장자리 자르기 <span class="value" id="cropv">0%</span></label><input id="crop" type="range" min="0" max="18" step="0.5" value="0"><p class="hint">네 변을 동일하게 자릅니다. 본문 잘림에 주의하세요.</p><label for="margin">바깥 여백 <span class="value" id="marginv">0 mm</span></label><input id="margin" type="range" min="0" max="18" step="1" value="0"><label for="gap">페이지 사이 간격 <span class="value" id="gapv">0 mm</span></label><input id="gap" type="range" min="0" max="18" step="1" value="0"><label class="switch"><input id="startFromSecond" type="checkbox">선택한 첫 페이지를 단독으로 배치 (표지용)</label></section><section><strong>배치 미리보기 (도식)</strong><div style="margin-top:12px" id="preview" class="sample"><div id="previewSheet" class="sheet"></div></div></section><section><button id="go" class="primary" disabled>PDF 변환하기</button><progress id="progress" max="100" value="0"></progress><div id="status">PDF를 선택해 주세요.</div><button id="download" type="button">완성된 PDF 저장하기</button><button id="share" type="button" hidden>공유 / 파일에 저장</button></section><footer><p>대용량 PDF는 메모리 부족으로 실패할 수 있습니다.<br>PDF는 기기 내에서 처리됩니다. 인터넷 연결 필요.<br>비공식 도구 · pdf-lib 사용</p></footer></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>
 'use strict';
const $=id=>document.getElementById(id),pt=mm=>mm*72/25.4;
let sourceFile=null, doc=null, result=null, chosen=[], pdfjsDoc=null, next=1, generation=0, busy=false;
const fields=['crop','margin','gap','mode','orientation','pageSize','startFromSecond'];
function parseRange(value,count){
 const out=[]; for(const token of value.split(',')){const m=token.trim().match(/^(\d+)(?:\s*-\s*(\d+))?$/);if(!m)throw Error('페이지 범위를 확인하세요.');
 const a=Number(m[1]),b=Number(m[2]||m[1]);if(a<1||b<1||a>count||b>count)throw Error('1~'+count+' 범위의 페이지를 입력하세요.');
 for(let i=a;;i+=a<=b?1:-1){out.push(i-1);if(i===b)break;if(out.length>100000)throw Error('선택 범위가 너무 큽니다.');}}
 return [...new Set(out)];
}
function indices(){if(!doc)return [];const n=doc.getPageCount();return $('selection').value==='all'?Array.from({length:n},(_,i)=>i):$('selection').value==='range'?parseRange($('range').value,n):chosen.slice();}
function groupsFor(list,n,cover){const groups=[];let i=0;if(cover&&list.length)groups.push([list[i++]]);for(;i<list.length;i+=n)groups.push(list.slice(i,i+n));return groups;}
function update(){const n=Number($('mode').value);for(const id of ['crop','margin','gap'])$(id+'v').textContent=$(id).value+(id==='crop'?'%':' mm');
 $('rangeBox').hidden=$('selection').value!=='range';$('visualBox').hidden=$('selection').value!=='visual';
 let list=[];try{list=indices();$('countInfo').textContent=doc?`선택 ${list.length}페이지 → 출력 ${groupsFor(list,n,$('startFromSecond').checked).length}장`:'';}catch(e){$('countInfo').textContent=e.message;}
 $('go').disabled=busy||!list.length;const sheet=$('previewSheet');sheet.replaceChildren();sheet.style.gridTemplateColumns='repeat(2,1fr)';sheet.style.gridTemplateRows=`repeat(${n/2},1fr)`;
 for(let i=0;i<n;i++){const d=document.createElement('div');d.className='page';d.style.cssText='display:grid;place-items:center;background:#e8effa;color:#2456a0;font-weight:bold';d.textContent=list[i]===undefined?i+1:list[i]+1;sheet.append(d);}
 $('preview').style.aspectRatio=$('orientation').value==='landscape'?'1.5':'0.72';sheet.style.padding=(4+Number($('margin').value)*.45)+'px';sheet.style.gap=(3+Number($('gap').value)*.4)+'px';
}
for(const id of fields){try{const v=localStorage.getItem('arranger-'+id);if(v!==null){if($(id).type==='checkbox')$(id).checked=v==='true';else $(id).value=v;}}catch{}$(id).addEventListener('input',()=>{try{localStorage.setItem('arranger-'+id,$(id).type==='checkbox'?$(id).checked:$(id).value);}catch{}update();});}
$('selection').onchange=update;$('range').oninput=update;
async function loadFile(f){if(busy||!f)return;if(f.type!=='application/pdf'&&!/\.pdf$/i.test(f.name)){ $('info').textContent='PDF 파일만 선택할 수 있습니다.';return;}sourceFile=f;const token=++generation;doc=null;result=null;chosen=[];next=1;$('thumbs').replaceChildren();$('more').hidden=true;$('download').style.display='none';$('share').hidden=true;$('thumbStatus').textContent='';if(pdfjsDoc){pdfjsDoc.destroy().catch(()=>{});pdfjsDoc=null;}update();$('info').textContent='PDF 읽는 중…';try{if(!window.PDFLib)throw Error('PDF 라이브러리 로딩 실패. 인터넷 연결 후 새로고침하세요.');const d=await PDFLib.PDFDocument.load(await f.arrayBuffer(),{updateMetadata:false});if(token!==generation)return;doc=d;$('info').textContent=`${f.name} · ${doc.getPageCount()}페이지 · ${(f.size/1048576).toFixed(1)} MB`;$('status').textContent='페이지를 선택하고 변환하세요.';}catch(e){if(token===generation)$('info').textContent=e.message;}update();}
$('file').onchange=()=>loadFile($('file').files[0]);
function pdfFromTransfer(dt){if(!dt)return null;return Array.from(dt.files||[]).concat(Array.from(dt.items||[]).filter(i=>i.kind==='file').map(i=>i.getAsFile()).filter(Boolean)).find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name))||null;}
const zone=$('dropZone'), target=$('pasteTarget');
zone.addEventListener('dragover',e=>{e.preventDefault();if(!busy)zone.classList.add('dragging');});
zone.addEventListener('dragleave',()=>zone.classList.remove('dragging'));
zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragging');if(busy)return;const f=pdfFromTransfer(e.dataTransfer);if(f){$('file').value='';loadFile(f);}else $('info').textContent='PDF 파일을 끌어다 놓아 주세요.';});
function pasteFallback(){target.hidden=false;target.focus();$('info').textContent='붙여넣기 영역을 길게 누르거나 ⌘V를 사용하세요.';}
$('pastePDF').onclick=async()=>{if(busy)return;try{if(navigator.clipboard?.read){const items=await navigator.clipboard.read();for(const item of items){if(item.types.includes('application/pdf')){const blob=await item.getType('application/pdf');$('file').value='';target.hidden=true;await loadFile(new File([blob],'Pasted.pdf',{type:'application/pdf'}));return;}}}}catch{}pasteFallback();};
document.addEventListener('paste',e=>{if(busy)return;const f=pdfFromTransfer(e.clipboardData);if(f){e.preventDefault();target.textContent='';target.hidden=true;$('file').value='';loadFile(f);}else if(e.target===target){e.preventDefault();$('info').textContent='Safari에서 복사한 PDF를 읽을 수 없습니다. 파일 선택 또는 드래그를 이용하세요.';}});
$('download').style.display='none';
async function loadThumbs(){if(!doc||busy)return;const token=generation;$('thumbLoad').disabled=true;$('more').disabled=true;try{
 if(!window.pdfjsLib){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';sc.onload=resolve;sc.onerror=()=>reject(Error('썸네일 라이브러리 로딩 실패'));document.head.append(sc);});}
 if(!pdfjsDoc){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';const d=await pdfjsLib.getDocument({data:new Uint8Array(await sourceFile.arrayBuffer()),isEvalSupported:false}).promise;if(token!==generation){await d.destroy();return;}pdfjsDoc=d;}
 const end=Math.min(next+23,doc.getPageCount());for(;next<=end;next++){if(token!==generation)return;const num=next,pg=await pdfjsDoc.getPage(num);if(token!==generation)return;const vp=pg.getViewport({scale:1}),v=pg.getViewport({scale:120/vp.width});const c=document.createElement('canvas');c.width=Math.ceil(v.width);c.height=Math.ceil(v.height);await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;if(token!==generation)return;pg.cleanup();const b=document.createElement('button');b.className='thumb';b.dataset.page=num-1;b.append(c,document.createTextNode(String(num)));b.onclick=()=>{const i=num-1;chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];mark();};$('thumbs').append(b);}
 $('more').hidden=next>doc.getPageCount();mark();
 }catch(e){$('thumbStatus').textContent=e.message;}finally{$('thumbLoad').disabled=false;$('more').disabled=false;}}
function mark(){for(const b of $('thumbs').children){const i=chosen.indexOf(Number(b.dataset.page));b.classList.toggle('selected',i>=0);b.lastChild.textContent=String(Number(b.dataset.page)+1)+(i>=0?' ✓ '+(i+1):'');}$('thumbStatus').textContent='선택 순서: '+chosen.map(x=>x+1).join(', ');update();}
$('thumbLoad').onclick=loadThumbs;$('more').onclick=loadThumbs;$('clearPages').onclick=()=>{chosen=[];mark();};
function dimensions(w,h,cols,rows,kind,landscape,margin,gap){if(kind==='auto')return [w*cols+2*margin+(cols-1)*gap,h*rows+2*margin+(rows-1)*gap];let a=kind==='a4'?[595.28,841.89]:[841.89,1190.55];if(landscape)a.reverse();return a;}
$('go').onclick=async()=>{if(busy||!doc)return;let list;try{list=indices();}catch(e){$('status').textContent=e.message;return;}if(!list.length)return;busy=true;update();$('file').disabled=true;$('pastePDF').disabled=true;$('download').style.display='none';$('share').hidden=true;result=null;const bar=$('progress');bar.style.display='block';bar.value=0;try{
 if(pdfjsDoc){await pdfjsDoc.destroy();pdfjsDoc=null;}
 const n=Number($('mode').value),cover=$('startFromSecond').checked,groups=groupsFor(list,n,cover),trim=Number($('crop').value)/100,margin=pt(+$('margin').value),gap=pt(+$('gap').value),kind=$('pageSize').value,landscape=$('orientation').value==='landscape',output=await PDFLib.PDFDocument.create();
 for(let g=0;g<groups.length;g++){const group=groups[g],cols=cover&&g===0?1:2,rows=cover&&g===0?1:n/2;const first=doc.getPage(group[0]).getCropBox();const [w,h]=dimensions(first.width*(1-2*trim),first.height*(1-2*trim),cols,rows,kind,landscape,margin,gap);const canvas=output.addPage([w,h]),cw=(w-2*margin-(cols-1)*gap)/cols,ch=(h-2*margin-(rows-1)*gap)/rows;if(cw<=0||ch<=0)throw Error('여백이 너무 큽니다.');
 for(let j=0;j<group.length;j++){const pg=doc.getPage(group[j]),b=pg.getCropBox(),box={left:b.x+b.width*trim,bottom:b.y+b.height*trim,right:b.x+b.width*(1-trim),top:b.y+b.height*(1-trim)};const e=await output.embedPage(pg,box),r=Math.min(cw/e.width,ch/e.height),ew=e.width*r,eh=e.height*r;canvas.drawPage(e,{x:margin+(j%cols)*(cw+gap)+(cw-ew)/2,y:h-margin-(Math.floor(j/cols)+1)*ch-Math.floor(j/cols)*gap+(ch-eh)/2,width:ew,height:eh});}
 bar.value=(g+1)/groups.length*90;$('status').textContent=`처리 중 ${g+1}/${groups.length}장`;if(g%2===0)await new Promise(r=>setTimeout(r,0));}
 $('status').textContent='저장 데이터 생성 중…';const bytes=await output.save({useObjectStreams:true});result=new File([bytes],sourceFile.name.replace(/\.pdf$/i,'')+`_${n}in1.pdf`,{type:'application/pdf'});bar.value=100;$('download').style.display='block';$('share').hidden=!(navigator.canShare&&navigator.canShare({files:[result]}));$('status').textContent=`완료: ${list.length}페이지 → ${groups.length}장. 파일 앱에 저장하세요.`;
 }catch(e){$('status').textContent='변환 실패: '+e.message;}finally{busy=false;$('file').disabled=false;$('pastePDF').disabled=false;update();}};
$('download').onclick=()=>{if(!result)return;const url=URL.createObjectURL(result),a=document.createElement('a');a.href=url;a.download=result.name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);};
$('share').onclick=async()=>{if(!result)return;try{await navigator.share({files:[result]});}catch(e){if(e.name!=='AbortError')$('status').textContent='공유 실패: '+e.message;}};
update();
</script></body></html>
